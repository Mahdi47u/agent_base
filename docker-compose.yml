services:
  backend:
    build:
      context: ./backend
      target: development
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    volumes:
      - ./backend:/workspace
      - backend-data:/workspace/data
    ports:
      - "8100:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  frontend:
    build:
      context: ./frontend
      target: development
    command: npm run dev -- --hostname 0.0.0.0
    environment:
      BACKEND_URL: http://backend:8000
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/workspace
      - frontend-node-modules:/workspace/node_modules
      - frontend-next-cache:/workspace/.next
    ports:
      - "3100:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
  frontend-node-modules:
  frontend-next-cache:
